<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Задание 8 — Контактная форма</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <header id="site-header">
    <div class="container">
      <h1 class="site-title">Лабораторная работа 8</h1>
    </div>
  </header>

  <main id="content" class="container">

    <h2>Контактная форма</h2>
    <p>Есть вопрос или предложение? Нажмите на кнопку и напишите нам.</p>

    <button type="button" id="open-form" class="btn">Написать нам</button>

  </main>

  <footer id="site-footer">
    <div class="container">
      <p>&copy; Анастасия Куликова</p>
    </div>
  </footer>

  <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" hidden>
    <div class="popup-box">

      <button type="button" class="popup-close" id="close-form" aria-label="Закрыть форму">&times;</button>

      <h2 class="popup-title" id="popup-title">Обратная связь</h2>

      <form id="feedback-form" novalidate>

        <label class="visually-hidden" for="f-name">ФИО</label>
        <input type="text" id="f-name" name="name" placeholder="ФИО" autocomplete="name" required />

        <label class="visually-hidden" for="f-email">Email</label>
        <input type="email" id="f-email" name="email" placeholder="Email" autocomplete="email" required />

        <label class="visually-hidden" for="f-phone">Телефон</label>
        <input type="tel" id="f-phone" name="phone" placeholder="Телефон" autocomplete="tel"
               pattern="[0-9+\s()\-]{7,20}" title="Только цифры, пробелы, скобки, + и дефис (от 7 символов)" required />

        <label class="visually-hidden" for="f-org">Организация</label>
        <input type="text" id="f-org" name="organization" placeholder="Организация" autocomplete="organization" />

        <label class="visually-hidden" for="f-message">Сообщение</label>
        <textarea id="f-message" name="message" rows="3" placeholder="Сообщение" required></textarea>

        <label class="agree">
          <input type="checkbox" id="f-agree" name="agree" required />
          <span>Согласен(на) с политикой обработки персональных данных</span>
        </label>

        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn" id="submit-button">Отправить</button>

      </form>

    </div>
  </div>

</body>

</html>
